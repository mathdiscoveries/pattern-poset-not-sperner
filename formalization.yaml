    type: paper
    location: "Journal of Combinatorial Theory, Series A 134 (2015), 1-35 (arXiv:1305.5569), Question 9.5"
    relationship: background
    note: "Poses Question 9.5 asking whether every interval in the classical permutation pattern poset is Sperner."
  - title: "The structure of the consecutive pattern poset"
    authors:
