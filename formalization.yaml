version: "v0.4"

project:
  name: "Non-Sperner Intervals and Exact Deficiency Family in the Permutation Pattern Poset"
  description: >-
    Unconditional Lean 4 + Mathlib formalization of the companion paper's
    refutation of McNamara and Steingrimsson's Question 9.5 (2015) via an
    explicit 19-element closed interval [213, 2574613] of largest rank size 7
    and width 8, and of its proof that
    for every k >= 1 there exists a principal downset [empty, tau_k] whose width
    exceeds its largest rank size by exactly k. Companion write-up and dated
    prior-work searches (arXiv, CORE 2026-11-20, Google Scholar 2026-11-22,
    Zenodo, DataCite, HAL, OSF, and Elizalde-McNamara 2015 / Vatter 2026) are
    published at https://mathdiscoveries.org/results/pattern-poset-not-sperner;
    no prior non-Sperner interval of the classical pattern poset was found in
    those logged searches, while Pouzet-Rosenberg (1986), Burosch et al.
    (1990, 1996), and print monographs remain unread/unsearched. Coverage by
    this package's Palomar comparison: of the companion paper's 9 main
    results, 2 are compared in Lean in full (22%; Corollary 1 and Theorem 3)
    and 2 in part (Proposition 2: the interval's size 19 and largest rank size
    7, not its full list of rank sizes; Theorem 8: deficiency exactly k for
    some principal downset, not for the named downset [empty, tau_k]); Theorem
    4 and Propositions 5, 6 and 7, with the full Proposition 2 and Theorem 8,
    are proved in this package's Lean library but not compared; Proposition 9
    is by certificate only; Conjecture 10 is open and not counted.
  authors:
    - "Tyler B. Hughes"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Tyler B. Hughes"

classification:
  arxiv: ["math.CO"]
  msc2020: ["05A05", "06A07"]

