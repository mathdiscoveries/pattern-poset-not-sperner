# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Non-Sperner Intervals and Exact Deficiency Family in the Permutation Pattern Poset"
  description: >-
    Unconditional Lean 4 + Mathlib formalization refuting McNamara and
    Steingrimsson's Question 9.5 (2015) via an explicit 19-element closed
    interval [213, 2574613] of largest rank size 7 and width 8, and proving that
    for every k >= 1 there exists a principal downset [empty, tau_k] whose width
    exceeds its largest rank size by exactly k. Companion write-up and dated
    prior-work searches (arXiv, CORE 2026-11-20, Google Scholar 2026-11-22,
    Zenodo, DataCite, HAL, OSF, and Elizalde-McNamara 2015 / Vatter 2026) are
    published at https://mathdiscoveries.org/results/pattern-poset-not-sperner;
    no prior non-Sperner interval of the classical pattern poset was found in
    those logged searches, while Pouzet-Rosenberg (1986), Burosch et al.
    (1990, 1996), and print monographs remain unread/unsearched.
  authors:
    - "Tyler B. Hughes"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Tyler B. Hughes"

classification:
  arxiv: ["math.CO"]
  msc2020: ["05A05", "06A07"]

