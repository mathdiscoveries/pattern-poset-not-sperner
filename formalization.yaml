# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Non-Sperner Intervals and Exact Deficiency Family in the Permutation Pattern Poset"
  description: >-
    Unconditional Lean 4 + Mathlib formalization refuting McNamara and
    Steingrimsson's Question 9.5 (2015) via an explicit 19-element closed
    interval [213, 2574613] of largest rank size 7 and width 8, and proving that
    for every k >= 1 there exists a principal downset [empty, tau_k] whose width
    exceeds its largest rank size by exactly k.
  authors:
    - "Tyler Hughes"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Tyler Hughes"

classification:
  arxiv: ["math.CO"]
  msc2020: ["05A05", "06A07"]

sources:
  - title: "Non-Sperner intervals and exact deficiency families in the permutation pattern poset"
    type: original-proof
    relationship: other
    note: >-
      Explicit 7-point interval counterexample and exact excess-k principal
      downset family discovered and formalized in Lean 4 by AI research agents
      built and directed by Tyler Hughes; documented at mathdiscoveries.org.
  - title: "On the topology of the permutation pattern poset"
    authors:
      - "Peter R. W. McNamara"
      - "Einar Steingrimsson"
    id: "https://doi.org/10.1016/j.jcta.2015.01.008"
    type: paper
    location: "Journal of Combinatorial Theory, Series A 134 (2015), 1-35"
    relationship: background
    note: "Poses Question 9.5 asking whether every interval in the permutation pattern poset is Sperner."

related_formalizations: []

