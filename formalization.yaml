    authors:
      - "Tyler B. Hughes"
    id: "https://mathdiscoveries.org/results/pattern-poset-not-sperner"
    type: paper
    location: "https://mathdiscoveries.org/results/pattern-poset-not-sperner"
    relationship: formalizes
    author_endorsement: participated
    note: >-
      The companion paper. It states and proves in writing every compared
      statement of this package (Corollary 1 and Theorem 3 in full, and the
      compared parts of Proposition 2 and Theorem 8), as well as the results
      proved in this package's Lean library but not compared (Theorem 4,
